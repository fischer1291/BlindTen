name: TestFlight

# Archives the app, signs it with Xcode's cloud-managed signing and uploads
# it to App Store Connect, where it shows up in TestFlight after processing.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   APP_STORE_CONNECT_KEY_ID     Key ID of an App Store Connect API key (Admin role)
#   APP_STORE_CONNECT_ISSUER_ID  Issuer ID shown above the list of keys
#   APP_STORE_CONNECT_KEY        Full contents of the downloaded AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID                10-character Team ID from developer.apple.com > Membership

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (leave empty to use the run number + 1)"
        required: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          missing=0
          for name in KEY_ID ISSUER_ID TEAM_ID KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret for $name (see the comment at the top of testflight.yml)"
              missing=1
            fi
          done
          [ "$missing" = 0 ]

      # App Store Connect only accepts builds made with Xcode 26 or later.
      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 or later on this runner"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Write the API key
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        # Accepts the .p8 as pasted: with or without the BEGIN/END lines, on
        # one line or many, with Windows line endings, or base64-encoded.
        # Only lengths are printed, never the key.
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          python3 - "$RUNNER_TEMP/keys/AuthKey.p8" <<'PY'
          import base64, binascii, os, re, sys
          raw = os.environ["KEY"].replace("\r", "").strip().strip('"').strip("'")
          raw = raw.replace("\\n", "\n")
          if "BEGIN" not in raw:
              try:
                  decoded = base64.b64decode(re.sub(r"\s", "", raw), validate=True).decode()
                  if "BEGIN" in decoded:
                      raw = decoded
              except (binascii.Error, UnicodeDecodeError, ValueError):
                  pass
          body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", raw)
          body = re.sub(r"\s", "", body)
          try:
              der = base64.b64decode(body, validate=True)
          except binascii.Error:
              sys.exit("::error::APP_STORE_CONNECT_KEY is not a valid .p8 key. Paste the whole text of AuthKey_XXXX.p8.")
          print(f"Key body: {len(body)} base64 characters, {len(der)} bytes")
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n"
          with open(sys.argv[1], "w") as f:
              f.write(pem)
          PY
          openssl pkey -in "$RUNNER_TEMP/keys/AuthKey.p8" -noout \
            || { echo "::error::APP_STORE_CONNECT_KEY could not be read as a private key. Paste the whole text of AuthKey_XXXX.p8."; exit 1; }
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Pick the build number
        env:
          REQUESTED: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BUILD="${REQUESTED:-$(( RUN_NUMBER + 1 ))}"
          if ! [[ "$BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error::Build number must be a whole number, got '$BUILD'"
            exit 1
          fi
          echo "Build number $BUILD"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project BlindTen.xcodeproj \
            -scheme BlindTen \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/BlindTen.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD"

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BlindTen.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Uploaded version $(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$RUNNER_TEMP/BlindTen.xcarchive/Info.plist") ($BUILD)"

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
