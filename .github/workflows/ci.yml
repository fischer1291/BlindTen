name: CI

on:
  push:
    paths-ignore:
      - "AppStore/**"
      - "website/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "AppStore/**"
      - "website/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: App Store metadata limits
        run: python3 Tools/check_metadata.py

      - name: String Catalog matches the text lists
        run: |
          python3 Tools/update_catalog.py
          git diff --exit-code BlindTen/Resources/Localizable.xcstrings

  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((rt for rt in devices if ".iOS-" in rt), reverse=True)
          print(next(d["udid"] for rt in ios for d in devices[rt] if d["name"].startswith("iPhone")))
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project BlindTen.xcodeproj \
            -scheme BlindTen \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
