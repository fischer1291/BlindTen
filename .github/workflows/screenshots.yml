name: App Store Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      BUNDLE_ID: com.leroyfischer.blindtengame
    steps:
      - uses: actions/checkout@v5

      - name: Boot a 6.9-inch iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for rt, ds in json.load(sys.stdin)["devices"].items() if ".iOS-" in rt for d in ds]
          for wanted in ("iPhone 17 Pro Max", "iPhone 16 Pro Max"):
              for d in devices:
                  if d["name"] == wanted:
                      print(d["udid"]); sys.exit(0)
          sys.exit("No 6.9-inch iPhone simulator found")
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100

      - name: Build the app (Debug, simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project BlindTen.xcodeproj \
            -scheme BlindTen \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/BlindTen.app

      - name: Capture screenshots
        run: |
          mkdir -p screenshots
          capture() {
            local scene=$1 wait=$2 name=$3
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -screenshotScene "$scene"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          # Warm-up launch so later launches are quick and predictable.
          capture home 8 warmup && rm screenshots/warmup.png
          capture home 4 01-home
          capture handoff 4 02-handoff
          capture turn 4 03-start
          capture reveal 2 04-dead-on-a
          capture reveal 3 04-dead-on-b
          capture reveal 4 04-dead-on-c
          capture showdown 4 05-showdown
          capture results 5 06-results
          capture paywall 4 iap-review-paywall
          capture partyPackArt 4 warmup && rm screenshots/warmup.png
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          cp "$DATA/Documents/PartyPackPromo.jpg" screenshots/party-pack-promo-1024.jpg

      - name: Check sizes
        run: |
          python3 - <<'PY'
          import struct, sys, pathlib
          ok = True
          for p in sorted(pathlib.Path("screenshots").glob("*.png")):
              w, h = struct.unpack(">II", p.read_bytes()[16:24])
              good = (w, h) in {(1320, 2868), (1290, 2796)}
              ok &= good
              print(f"{'ok' if good else 'WRONG':5} {w}x{h}  {p.name}")
          sys.exit(0 if ok else 1)
          PY
          sips -g pixelWidth -g pixelHeight -g hasAlpha screenshots/party-pack-promo-1024.jpg

      - uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: screenshots/

      - name: Publish to the app-store-assets branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/assets && mkdir -p /tmp/assets
          cp screenshots/* /tmp/assets/
          git checkout --orphan app-store-assets
          git rm -rf --quiet .
          mkdir -p screenshots && cp /tmp/assets/* screenshots/
          git add screenshots
          git commit -m "App Store screenshots from ${GITHUB_SHA::7} [skip ci]"
          git push --force origin app-store-assets
