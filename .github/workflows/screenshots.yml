name: App Store Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      BUNDLE_ID: com.leroyfischer.blindtengame
    steps:
      - uses: actions/checkout@v5

      - name: Boot a 6.9-inch iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for rt, ds in json.load(sys.stdin)["devices"].items() if ".iOS-" in rt for d in ds]
          for wanted in ("iPhone 17 Pro Max", "iPhone 16 Pro Max"):
              for d in devices:
                  if d["name"] == wanted:
                      print(d["udid"]); sys.exit(0)
          sys.exit("No 6.9-inch iPhone simulator found")
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100

      - name: Build the app (Debug, simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project BlindTen.xcodeproj \
            -scheme BlindTen \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/BlindTen.app

      - name: Capture screenshots
        run: |
          mkdir -p screenshots/iPhone-6.9 screenshots/InAppPurchase
          # App Store Connect rejects images with an alpha channel, so every
          # capture is saved as JPEG under the name it is uploaded with.
          capture() {
            local scene=$1 wait=$2 out=$3
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -screenshotScene "$scene"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot --type=jpeg "screenshots/$out.jpg"
          }
          # Warm-up launch so later launches are quick and predictable.
          capture home 8 warmup && rm screenshots/warmup.jpg
          capture reveal 3 iPhone-6.9/1-dead-on
          capture showdown 4 iPhone-6.9/2-showdown
          capture results 5 iPhone-6.9/3-awards
          capture handoff 4 iPhone-6.9/4-pass-the-phone
          capture turn 4 iPhone-6.9/5-start
          capture home 4 iPhone-6.9/6-modes
          capture paywall 4 InAppPurchase/review-screenshot
          capture partyPackArt 4 warmup && rm screenshots/warmup.jpg
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          cp "$DATA/Documents/PartyPackPromo.jpg" screenshots/InAppPurchase/party-pack-promo-1024.jpg

      - name: Check sizes and alpha
        run: |
          ok=1
          for f in screenshots/*/*.jpg; do
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/ {print $2}')
            h=$(sips -g pixelHeight "$f" | awk '/pixelHeight/ {print $2}')
            alpha=$(sips -g hasAlpha "$f" | awk '/hasAlpha/ {print $2}')
            case "$f" in
              *party-pack-promo-1024.jpg) want="1024x1024" ;;
              *) want="1320x2868" ;;
            esac
            if [ "${w}x${h}" = "$want" ] && [ "$alpha" = "no" ]; then
              echo "ok     ${w}x${h} alpha=$alpha  $f"
            else
              echo "WRONG  ${w}x${h} alpha=$alpha  $f (want $want, no alpha)"
              ok=0
            fi
          done
          [ "$ok" = 1 ]

      - uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: screenshots/

      - name: Publish to the app-store-assets branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/assets && cp -R screenshots /tmp/assets
          git checkout --orphan app-store-assets
          git rm -rf --quiet .
          rm -rf screenshots && cp -R /tmp/assets screenshots
          git add screenshots
          git commit -m "App Store screenshots from ${GITHUB_SHA::7} [skip ci]"
          git push --force origin app-store-assets
