name: App Store Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      BUNDLE_ID: com.leroyfischer.blindtengame
    steps:
      - uses: actions/checkout@v5

      - name: Boot a 6.9-inch iPhone simulator
        timeout-minutes: 10
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for rt, ds in json.load(sys.stdin)["devices"].items() if ".iOS-" in rt for d in ds]
          for wanted in ("iPhone 17 Pro Max", "iPhone 16 Pro Max"):
              for d in devices:
                  if d["name"] == wanted:
                      print(d["udid"]); sys.exit(0)
          sys.exit("No 6.9-inch iPhone simulator found")
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100

      - name: Boot a 6.3-inch iPhone simulator
        timeout-minutes: 10
        run: |
          UDID63=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for rt, ds in json.load(sys.stdin)["devices"].items() if ".iOS-" in rt for d in ds]
          for wanted in ("iPhone 17 Pro", "iPhone 16 Pro"):
              for d in devices:
                  if d["name"] == wanted:
                      print(d["udid"]); sys.exit(0)
          sys.exit("No 6.3-inch iPhone simulator found")
          ')
          echo "UDID63=$UDID63" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID63"
          xcrun simctl bootstatus "$UDID63" -b
          xcrun simctl ui "$UDID63" appearance dark
          xcrun simctl status_bar "$UDID63" override --time "9:41" \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100

      - name: Build the app (Debug, simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project BlindTen.xcodeproj \
            -scheme BlindTen \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/BlindTen.app
          xcrun simctl install "$UDID63" build/Build/Products/Debug-iphonesimulator/BlindTen.app

      - name: Capture screenshots
        run: |
          mkdir -p screenshots/raw/iPhone-6.9 screenshots/InAppPurchase
          # Raw captures, named by scene; the captioned upload images are
          # composed from them in a later step.
          capture() {
            local scene=$1 wait=$2 out=$3
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -screenshotScene "$scene"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot --type=jpeg "screenshots/$out.jpg"
          }
          # Warm-up launch so later launches are quick and predictable.
          capture home 8 warmup && rm screenshots/warmup.jpg
          capture reveal 3 raw/iPhone-6.9/dead-on
          capture showdown 4 raw/iPhone-6.9/showdown
          capture results 5 raw/iPhone-6.9/awards
          capture handoff 4 raw/iPhone-6.9/pass-the-phone
          capture turn 4 raw/iPhone-6.9/start
          capture homeReturning 4 raw/iPhone-6.9/home
          capture challengeSummary 4 raw/iPhone-6.9/streak
          capture streaks 4 raw/iPhone-6.9/seasons
          capture players 4 raw/iPhone-6.9/modes
          capture paywall 4 InAppPurchase/review-screenshot
          capture partyPackArt 4 warmup && rm screenshots/warmup.jpg
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          cp "$DATA/Documents/PartyPackPromo.jpg" screenshots/InAppPurchase/party-pack-promo-1024.jpg

      - name: Capture 6.3-inch screenshots
        run: |
          mkdir -p screenshots/raw/iPhone-6.3
          capture() {
            xcrun simctl terminate "$UDID63" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID63" "$BUNDLE_ID" -screenshotScene "$1"
            sleep "$2"
            xcrun simctl io "$UDID63" screenshot --type=jpeg "screenshots/raw/iPhone-6.3/$3.jpg"
          }
          capture home 8 warmup && rm screenshots/raw/iPhone-6.3/warmup.jpg
          capture reveal 3 dead-on
          capture showdown 4 showdown
          capture results 5 awards
          capture handoff 4 pass-the-phone
          capture turn 4 start
          capture homeReturning 4 home
          capture challengeSummary 4 streak
          capture streaks 4 seasons
          capture players 4 modes

      - name: Compose captioned screenshots
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q playwright pillow
          .venv/bin/python -m playwright install chromium
          rm -rf AppStore/Screenshots/raw
          mkdir -p AppStore/Screenshots
          cp -R screenshots/raw AppStore/Screenshots/raw
          .venv/bin/python marketing/appstore-art/screenshots.py
          mkdir -p screenshots/iPhone-6.9 screenshots/iPhone-6.3
          cp AppStore/Screenshots/iPhone-6.9/*.jpg screenshots/iPhone-6.9/
          cp AppStore/Screenshots/iPhone-6.3/*.jpg screenshots/iPhone-6.3/

      - name: Check sizes and alpha
        run: |
          ok=1
          for f in screenshots/*/*.jpg screenshots/raw/*/*.jpg; do
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/ {print $2}')
            h=$(sips -g pixelHeight "$f" | awk '/pixelHeight/ {print $2}')
            alpha=$(sips -g hasAlpha "$f" | awk '/hasAlpha/ {print $2}')
            case "$f" in
              *party-pack-promo-1024.jpg) want="1024x1024" ;;
              *iPhone-6.3/*) want="1206x2622" ;;
              *) want="1320x2868" ;;
            esac
            if [ "${w}x${h}" = "$want" ] && [ "$alpha" = "no" ]; then
              echo "ok     ${w}x${h} alpha=$alpha  $f"
            else
              echo "WRONG  ${w}x${h} alpha=$alpha  $f (want $want, no alpha)"
              ok=0
            fi
          done
          [ "$ok" = 1 ]

      - uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: screenshots/

      - name: Commit to AppStore/Screenshots on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp screenshots/InAppPurchase/*.jpg AppStore/Screenshots/InAppPurchase/
          git add AppStore/Screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git commit -m "Update App Store screenshots from ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
